apiVersion: apps/v1
kind: Deployment
metadata:
  name: techdesk-web
  namespace: techdesk
  labels:
    app: techdesk-web
    app.kubernetes.io/part-of: business-builds
spec:
  replicas: 2
  selector:
    matchLabels:
      app: techdesk-web
  template:
    metadata:
      labels:
        app: techdesk-web
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
      volumes:
        - name: page
          configMap:
            name: techdesk-web-page
