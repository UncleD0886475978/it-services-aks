apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: techdesk-db-data
  namespace: techdesk
  labels:
    app: techdesk-db
    app.kubernetes.io/part-of: business-builds
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  # No storageClassName on purpose: the cluster's default StorageClass is
  # used, so the same manifest works on EKS and AKS.
