# EXAMPLE ONLY — demo credentials for local learning.
# Change the password before applying anywhere you care about, or create
# the secret directly without storing it in a file:
#
#   kubectl -n techdesk create secret generic techdesk-db-secret \
#     --from-literal=POSTGRES_PASSWORD='<choose-a-strong-password>'
#
# setup.sh deploy applies this example ONLY if no techdesk-db-secret exists
# yet in the techdesk namespace, and prints a warning when it does.
apiVersion: v1
kind: Secret
metadata:
  name: techdesk-db-secret
  namespace: techdesk
  labels:
    app: techdesk-db
    app.kubernetes.io/part-of: business-builds
type: Opaque
stringData:
  POSTGRES_PASSWORD: techdesk-demo-change-me
